name: Attach 890.by to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attach-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Attach custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://api.cloudflare.com/client/v4/accounts/5354e054d53157bf5b02ce5119d08948/pages/projects/890-by/domains' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"name":"890.by"}'
